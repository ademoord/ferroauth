<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" width="256" height="256" role="img" aria-labelledby="title desc">
  <title id="title">ferroauth</title>
  <desc id="desc">An iron shield with a molten keyhole forged into it, and the periodic tile for iron, 26 Fe.</desc>
  <defs>
    <linearGradient id="iron" x1="0" y1="0" x2="0.35" y2="1">
      <stop offset="0" stop-color="#6b7280"/>
      <stop offset="0.45" stop-color="#374151"/>
      <stop offset="1" stop-color="#111827"/>
    </linearGradient>
    <linearGradient id="rim" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#fbbf24"/>
      <stop offset="0.5" stop-color="#f97316"/>
      <stop offset="1" stop-color="#b91c1c"/>
    </linearGradient>
    <radialGradient id="molten" cx="0.5" cy="0.38" r="0.7">
      <stop offset="0" stop-color="#fff7d6"/>
      <stop offset="0.3" stop-color="#fcd34d"/>
      <stop offset="0.7" stop-color="#f97316"/>
      <stop offset="1" stop-color="#c2410c"/>
    </radialGradient>
    <filter id="glow" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="7" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <!-- sparks flying off the forge -->
  <g stroke="#fbbf24" stroke-width="3" stroke-linecap="round">
    <line x1="128" y1="14" x2="128" y2="2"/>
    <line x1="98" y1="22" x2="90" y2="10"/>
    <line x1="158" y1="22" x2="166" y2="10"/>
  </g>
  <circle cx="74" cy="18" r="2.5" fill="#f97316"/>
  <circle cx="184" cy="16" r="2" fill="#f97316"/>

  <!-- the iron shield -->
  <path d="M128 26 L214 56 V122 C214 180 178 218 128 236 C78 218 42 180 42 122 V56 Z"
        fill="url(#iron)" stroke="url(#rim)" stroke-width="8" stroke-linejoin="round"/>
  <path d="M128 42 L200 67 V122 C200 170 170 203 128 219 C86 203 56 170 56 122 V67 Z"
        fill="none" stroke="#ffffff" stroke-opacity="0.12" stroke-width="2"/>

  <!-- rivets -->
  <g fill="#9ca3af" stroke="#1f2937" stroke-width="1.5">
    <circle cx="70" cy="76" r="5"/>
    <circle cx="186" cy="76" r="5"/>
    <circle cx="72" cy="162" r="5"/>
    <circle cx="184" cy="162" r="5"/>
  </g>

  <!-- molten keyhole -->
  <g filter="url(#glow)">
    <path d="M128 86 a26 26 0 0 1 14 47.9 L150 176 H106 L114 133.9 A26 26 0 0 1 128 86 Z" fill="url(#molten)"/>
  </g>

  <!-- periodic tile: iron -->
  <g transform="translate(176 176)">
    <rect x="0" y="0" width="64" height="64" rx="10" fill="#0f172a" stroke="url(#rim)" stroke-width="4"/>
    <text x="9" y="18" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12" fill="#fbbf24">26</text>
    <text x="32" y="50" text-anchor="middle" font-family="system-ui, -apple-system, Segoe UI, Helvetica, Arial, sans-serif" font-size="28" font-weight="800" fill="#f8fafc">Fe</text>
  </g>
</svg>
